[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
; This example is the only build that compiles the component's ESP-only code paths, so it is
; where their warnings have to become errors (the host build never sees them). Safe to enable
; unconditionally: the platform version above is pinned, so a new toolchain warning can only
; appear on a deliberate bump, and this example is excluded from the published component.
board_build.cmake_extra_args = -DENABLE_WERROR=ON

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
upload_protocol = esp-builtin
