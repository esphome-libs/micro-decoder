---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual "Run workflow" from the Actions tab.
  workflow_dispatch:

# Least privilege: every job here only reads the repo (checkout, build, test, cache). Jobs that
# need more should add a narrower job-level permissions block rather than widening this default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # New commits supersede an in-progress run on the same ref instead of running both to completion.
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: esphome/pre-commit-action@43cd1109c09c544d97196f7730ee5b2e0cc6d81e # v3.0.1 fork with pinned actions/cache

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 libcurl4-openssl-dev portaudio19-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('cmake/host.cmake') }}

      - name: Run clang-tidy
        env:
          CLANG_TIDY: clang-tidy-18
        run: ./script/clang-tidy.sh

  include-check:
    name: Include check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools-18 libcurl4-openssl-dev portaudio19-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/check_includes/_deps
          key: fetchcontent-include-check-${{ hashFiles('cmake/host.cmake') }}

      - name: Run include check
        env:
          CLANG_INCLUDE_CLEANER: clang-include-cleaner-18
        run: ./script/check-includes.sh

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pin cppcheck and build it from source: ubuntu-latest's apt package lags
      # by several minor versions and produces different findings than the
      # version developers run locally (Homebrew). Bump deliberately, in step
      # with local installs. The build is cached, so only the first run per
      # version pays the compile.
      CPPCHECK_VERSION: "2.21.0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache pinned cppcheck
        id: cache-cppcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cppcheck-install
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-${{ runner.os }}

      - name: Build pinned cppcheck
        if: steps.cache-cppcheck.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$CPPCHECK_VERSION" https://github.com/danmar/cppcheck /tmp/cppcheck
          cmake -S /tmp/cppcheck -B /tmp/cppcheck/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck-install"
          cmake --build /tmp/cppcheck/build -j"$(nproc)"
          cmake --install /tmp/cppcheck/build

      - name: Add pinned cppcheck to PATH
        run: echo "$HOME/cppcheck-install/bin" >> "$GITHUB_PATH"

      - name: Run cppcheck
        run: ./script/cppcheck.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev portaudio19-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('cmake/host.cmake') }}

      - name: Configure CMake
        run: cmake -B build -DENABLE_SANITIZERS=ON -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/build/_deps
          key: fetchcontent-tests-${{ hashFiles('cmake/host.cmake') }}

      - name: Configure unit tests with sanitizers
        run: cmake -B tests/build -DENABLE_SANITIZERS=ON -DENABLE_WERROR=ON tests

      - name: Build unit tests
        run: cmake --build tests/build --parallel

      - name: Run unit tests
        run: ctest --test-dir tests/build --output-on-failure

  test-tsan:
    name: Unit tests (ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/build-tsan/_deps
          key: fetchcontent-tests-tsan-${{ hashFiles('cmake/host.cmake') }}

      - name: Configure unit tests with ThreadSanitizer
        # The reader, decoder, and caller threads hand off through the ring buffer and event
        # flags, so TSan covers races that ASan/UBSan cannot see.
        # ENABLE_TSAN is mutually exclusive with ENABLE_SANITIZERS.
        run: cmake -B tests/build-tsan -DENABLE_TSAN=ON -DENABLE_WERROR=ON tests

      - name: Build unit tests
        run: cmake --build tests/build-tsan --parallel

      - name: Run unit tests
        run: ctest --test-dir tests/build-tsan --output-on-failure

  platformio:
    name: PlatformIO Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - example: decode_benchmark
            environments: esp32,esp32s3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            examples/${{ matrix.example }}/.pio
            examples/${{ matrix.example }}/managed_components
          key: pio-${{ matrix.example }}-${{ hashFiles(format('examples/{0}/platformio.ini', matrix.example), format('examples/{0}/dependencies.lock', matrix.example)) }}
          restore-keys: |
            pio-${{ matrix.example }}-

      - name: Install PlatformIO
        run: pip install platformio

      # This is the only build that compiles the component's ESP-only code paths, so it is
      # where their warnings have to be errors. The example's platformio.ini turns ENABLE_WERROR
      # on through board_build.cmake_extra_args against a pinned platform version.
      - name: Build ${{ matrix.example }}
        run: |
          IFS=',' read -ra ENVS <<< "${{ matrix.environments }}"
          for env in "${ENVS[@]}"; do
            echo "Building environment: $env"
            pio run -d examples/${{ matrix.example }} -e "$env"
          done

  # Single aggregating status for branch protection: require only "CI success" instead of every job.
  # always() so it reports even when a job fails; skipped dependencies are treated as passing (only
  # failure/cancelled blocks). New jobs added above are covered once listed under needs.
  ci-success:
    name: CI success
    if: always()
    needs:
      - pre-commit
      - lint
      - include-check
      - cppcheck
      - build
      - test
      - test-tsan
      - platformio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more CI jobs failed or were cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: Report success
        run: echo "All required CI jobs passed (skipped jobs are allowed)."
